[versions]
kotlin = "2.0.20"
intellijPlatform = "2.6.0"
# Hygiene bumps (neither 2.17.2 nor snakeyaml 2.3 had a reachable CVE in this codebase).
# These are the latest lines as of the 2026-08 audit; confirm they resolve against Maven
# Central at build time and move to the newest patch if a later one exists.
jackson = "2.18.2"
snakeyaml = "2.6"
coroutines = "1.8.1"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
