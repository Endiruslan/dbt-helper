# Publishing a GitHub release builds the plugin, uploads it to JetBrains Marketplace
# and attaches the zip to the release. Needs the PUBLISH_TOKEN repo secret
# (https://plugins.jetbrains.com/author/me/tokens).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches pluginVersion
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          [ "v$version" = "${{ github.event.release.tag_name }}" ] || { echo "tag ${{ github.event.release.tag_name }} != v$version"; exit 1; }

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Attach zip to release
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
